schema_version: '2.0'
title: Shimoni2009 - Escherichia Coli SOS
description: Shimoni2009 - Escherichia Coli SOS Simple model, involving only the basic
  components of the circuit, sufficient to explain the peaks in the promoter activities
  of recA and lexA. It can be used to explore generegulation shimoni2009 escherichia
  coli sos model2937159804 dynamics and compare simulation behavior across conditions.
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Yishai Shimoni
- Shoshy Altuvia
- Hanah Margalit
- Ofer Biham
upstream:
  id: biomodels_ebi:MODEL2937159804
  source_db: biomodels_ebi
  source_id: MODEL2937159804
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL2937159804
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL2937159804?filename=MODEL2937159804_url.xml
  license: CC0
biosim:
  entrypoint: src.shimoni2009_escherichia_coli_sos_model2937159804_model:Shimoni2009EscherichiaColiSosModel2937159804Model
  init_kwargs:
    model_path: data/MODEL2937159804.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: lexa
    maps_to: LexA
    label: LexA
    description: LexA observable. Maps to SBML symbol `LexA`.
  - name: reca
    maps_to: RecA
    label: RecA
    description: RecA observable. Maps to SBML symbol `RecA`.
  - name: lexa_messenger_rna
    maps_to: mLexA
    label: mLexA
    description: mLexA observable. Maps to SBML symbol `mLexA`.
  - name: reca_messenger_rna
    maps_to: mRecA
    label: mRecA
    description: mRecA observable. Maps to SBML symbol `mRecA`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
