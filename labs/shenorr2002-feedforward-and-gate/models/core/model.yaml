schema_version: '2.0'
title: Shen-Orr2002_FeedForward_AND_gate
description: 'This is the coherent feed forward loop with an AND-gate like control
  of the response operon described in the article: Network motifs in the transcriptional
  regulation network of Escherichia coli Shai. It can be used to explore generegulation
  shen orr2002 feedforward and gate dynamics and compare simulation behavior across
  conditions.'
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Shai S Shen-Orr
- Ron Milo
- Shmoolik Mangan
- Uri Alon
upstream:
  id: biomodels_ebi:BIOMD0000000316
  source_db: biomodels_ebi
  source_id: BIOMD0000000316
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000316
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000316?filename=BIOMD0000000316_url.xml
  license: CC0
biosim:
  entrypoint: src.shen_orr2002_feedforward_and_gate_biomd0000000316_model:ShenOrr2002FeedforwardAndGateBiomd0000000316Model
  init_kwargs:
    model_path: data/BIOMD0000000316.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
- name: input_signal_x
  value: 0.0
  units: native SBML value
  description: Boundary species `X`, the source upstream input to the coherent feed-forward
    loop.
io:
  inputs:
  - name: input_signal_x
    maps_to: X
    label: Input signal X
    description: Boundary species `X`, the source upstream input to the coherent feed-forward
      loop.
  outputs:
  - name: intermediate_regulator_y
    maps_to: Y
    label: Y
    description: Y observable. Maps to SBML symbol `Y`.
  - name: response_operon_z
    maps_to: Z
    label: Z
    description: Z observable. Maps to SBML symbol `Z`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
