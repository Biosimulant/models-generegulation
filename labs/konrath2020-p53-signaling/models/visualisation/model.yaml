schema_version: '2.0'
title: Konrath2020_p53_signaling_model Visualisation
description: Dedicated presentation model for p53 subpopulation signaling.
standard: other
tags:
- generegulation
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.gene_regulation_visualisation:GeneRegulationVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Konrath2020 P53 Signaling Lab
    question: Does the p53 signaling module activate over time?
    answer_focus: p53 signaling trajectory
    caveat: The exposed DNA damage control maps directly to source parameter `damage`.
    alias: konrath2020_p53_signaling
    observables:
    - id: p53
      port: p53
      label: p53
    - id: p53a
      port: active_p53
      label: p53a
    - id: Mdm2
      port: mdm2
      label: Mdm2
    - id: pATM
      port: phosphorylated_atm
      label: ATM P
    state_observables:
    - p53
    - p53a
    - Mdm2_mRNA
    - Mdm2
    - Wip1_mRNA
    - Wip1
    - pATM
    species_label_ids:
    - p53
    - p53a
    - Mdm2_mRNA
    - Mdm2
    - Wip1_mRNA
    - Wip1
    - pATM
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs: []
  outputs: []
