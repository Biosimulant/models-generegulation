schema_version: '2.0'
title: Koster1988_Histone_Expression
description: 'This model is described in the article: Kinetics of histone gene expression
  during early development of Xenopus laevis. It can be used to explore generegulation
  koster1988 histone expression model5954483266 dynamics and compare simulation behavior
  across conditions.'
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- J G Koster
- "O H Destr\xE9e"
- H V Westerhoff
upstream:
  id: biomodels_ebi:MODEL5954483266
  source_db: biomodels_ebi
  source_id: MODEL5954483266
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL5954483266
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL5954483266?filename=MODEL5954483266_url.xml
  license: CC0
biosim:
  entrypoint: src.koster1988_histone_expression_model5954483266_model:Koster1988HistoneExpressionModel5954483266Model
  init_kwargs:
    model_path: data/MODEL5954483266.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: histone_rna
    maps_to: RNA
    label: H3 RNA
    description: H3 RNA observable. Maps to SBML symbol `RNA`.
  - name: histone_protein
    maps_to: Prot
    label: H3 Protein
    description: H3 Protein observable. Maps to SBML symbol `Prot`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
