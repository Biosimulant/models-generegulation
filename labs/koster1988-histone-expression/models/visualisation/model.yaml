schema_version: '2.0'
title: Koster1988_Histone_Expression Visualisation
description: Dedicated presentation model for Xenopus histone expression kinetics.
standard: other
tags:
- generegulation
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.gene_regulation_visualisation:GeneRegulationVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Koster1988 Histone Expression Lab
    question: What histone expression state does the model reach?
    answer_focus: histone expression accumulation
    caveat: Small model; labels avoid claims beyond the source species names.
    alias: koster1988_histone_expression
    observables:
    - id: RNA
      port: histone_rna
      label: H3 RNA
    - id: Prot
      port: histone_protein
      label: H3 Protein
    state_observables:
    - RNA
    - Prot
    species_label_ids:
    - RNA
    - Prot
  communication_step: 1.0
runtime:
  dependencies:
    packages:
    - PyYAML==6.0.2
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs: []
  outputs: []
