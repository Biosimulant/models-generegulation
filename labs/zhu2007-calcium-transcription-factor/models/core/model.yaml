schema_version: '2.0'
title: Zhu2007_TF_modulated_by_Calcium
description: 'This a model from the article: A theoretical study on activation of
  transcription factor modulated by intracellular Ca2+ oscillations. It can be used
  to explore generegulation zhu2007 tf modulated by calcium dynamics and compare simulation
  behavior across conditions.'
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Chun-lian Zhu
- Yuan Zheng
- Ya Jia
upstream:
  id: biomodels_ebi:BIOMD0000000166
  source_db: biomodels_ebi
  source_id: BIOMD0000000166
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000166
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000166?filename=BIOMD0000000166_url.xml
  license: CC0
biosim:
  entrypoint: src.zhu2007_tf_modulated_by_calcium_biomd0000000166_model:Zhu2007TfModulatedByCalciumBiomd0000000166Model
  init_kwargs:
    model_path: data/BIOMD0000000166.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: active_transcription_factor
    maps_to: X
    label: TF A
    description: TF A observable. Maps to SBML symbol `X`.
  - name: stored_calcium
    maps_to: Y
    label: Calcium in store
    description: Calcium in store observable. Maps to SBML symbol `Y`.
  - name: cytoplasmic_calcium
    maps_to: Z
    label: Calcium in cytoplasm
    description: Calcium in cytoplasm observable. Maps to SBML symbol `Z`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
