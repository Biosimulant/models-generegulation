schema_version: '2.0'
title: Zeilinger2006_PRR7-PRR9light-Yprime
description: The model reproduces the time profile of TOC1 and Y mRNA for a 8:16 cycle
  as depicted in Fig7A and 7B. A simple algorithm in the event section accomplishes
  the 8 hour light and 16 hour dark cycle.
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Melanie N Zeilinger
- "Eva M Farr\xE9"
- Stephanie R Taylor
- Steve A Kay
- Francis J Doyle
upstream:
  id: biomodels_ebi:BIOMD0000000097
  source_db: biomodels_ebi
  source_id: BIOMD0000000097
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000097
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000097?filename=BIOMD0000000097_url.xml
  license: CC0
biosim:
  entrypoint: src.zeilinger2006_prr7_prr9light_yprime_biomd0000000097_model:Zeilinger2006Prr7Prr9lightYprimeBiomd0000000097Model
  init_kwargs:
    model_path: data/BIOMD0000000097.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: toc1_messenger_rna
    maps_to: cTm
    label: cTm
    description: cTm observable. Maps to SBML symbol `cTm`.
  - name: nuclear_y
    maps_to: cYn
    label: cYn
    description: cYn observable. Maps to SBML symbol `cYn`.
  - name: prr7_messenger_rna
    maps_to: cP7m
    label: cP7m
    description: cP7m observable. Maps to SBML symbol `cP7m`.
  - name: prr9_messenger_rna
    maps_to: cP9m
    label: cP9m
    description: cP9m observable. Maps to SBML symbol `cP9m`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
