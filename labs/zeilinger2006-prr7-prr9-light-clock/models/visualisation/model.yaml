schema_version: '2.0'
title: Zeilinger2006_PRR7-PRR9light-Yprime Visualisation
description: Dedicated presentation model for plant light/circadian clock.
standard: other
tags:
- generegulation
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.gene_regulation_visualisation:GeneRegulationVisualisationModel
  init_kwargs:
