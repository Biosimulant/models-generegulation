schema_version: '2.0'
package: firczuk2013-eukaryotic-translation
version: 1.0.0
title: Firczuk2013 Eukaryotic Translation Lab
description: yeast mRNA translation machinery. Firczuk2013 - Eukaryotic mRNA translation
  machinery This is a model of Saccharomyces cerevisiae mRNA translation which includes
  the initiation, elongation and termination phases. It can be used to explore generegulation
  firczuk2013 eukaryotic mrna translation machiner dynamics and compare simulation
  behavior across conditions.
