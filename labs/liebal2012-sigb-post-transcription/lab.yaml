schema_version: '2.0'
title: Liebal2012 Sigb Post Transcription Lab
description: B. subtilis sigma-B post-transcriptional instability. Liebal2012 - B.subtilis
  post-transcription instability model An important transcription factor of B.subsilis
  is sigma B . It can be used to explore generegulation liebal2012 b subtilis post
  transcriptional dynamics and compare simulation behavior across conditions.
models:
- alias: liebal2012_sigb_post_transcription
  path: models/core
  parameters:
    model_path: data/BIOMD0000000459.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: liebal2012_sigb_post_transcription.sigma_b
  to:
  - visualisation.liebal2012_sigb_post_transcription_sigma_b
- from: liebal2012_sigb_post_transcription.lacz_reporter
  to:
  - visualisation.liebal2012_sigb_post_transcription_lacz_reporter
- from: liebal2012_sigb_post_transcription.model_state_x
  to:
  - visualisation.liebal2012_sigb_post_transcription_model_state_x
- from: liebal2012_sigb_post_transcription.state
  to:
  - visualisation.liebal2012_sigb_post_transcription_state
- from: liebal2012_sigb_post_transcription.summary
  to:
  - visualisation.liebal2012_sigb_post_transcription_summary
- from: liebal2012_sigb_post_transcription.species_labels
  to:
  - visualisation.liebal2012_sigb_post_transcription_species_labels
io:
  inputs:
  - name: iptg
    maps_to: liebal2012_sigb_post_transcription.iptg
    label: IPTG
    description: Boundary species `IPTG`, the source induction level for this sigma-B
      model variant.
  outputs:
  - name: sigma_b
    maps_to: liebal2012_sigb_post_transcription.sigma_b
  - name: lacz_reporter
    maps_to: liebal2012_sigb_post_transcription.lacz_reporter
  - name: model_state_x
    maps_to: liebal2012_sigb_post_transcription.model_state_x
  - name: state
    maps_to: liebal2012_sigb_post_transcription.state
  - name: summary
    maps_to: liebal2012_sigb_post_transcription.summary
  - name: species_labels
    maps_to: liebal2012_sigb_post_transcription.species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
