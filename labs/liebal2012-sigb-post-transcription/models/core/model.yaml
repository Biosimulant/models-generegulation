schema_version: '2.0'
title: Liebal2012 - B.subtilis post-transcriptional instability model
description: Liebal2012 - B.subtilis post-transcription instability model An important
  transcription factor of B.subsilis is sigma B . It can be used to explore generegulation
  liebal2012 b subtilis post transcriptional dynamics and compare simulation behavior
  across conditions.
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Ulf W Liebal
- Praveen K Sappa
- Thomas Millat
- Leif Steil
- Georg Homuth
upstream:
  id: biomodels_ebi:BIOMD0000000459
  source_db: biomodels_ebi
  source_id: BIOMD0000000459
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000459
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000459?filename=BIOMD0000000459_url.xml
  license: CC0
biosim:
  entrypoint: src.liebal2012_b_subtilis_post_transcriptional_insta_biomd0000000459_model:Liebal2012BSubtilisPostTranscriptionalInstaBiomd0000000459Model
  init_kwargs:
    model_path: data/BIOMD0000000459.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
- name: iptg
  value: 100.0
  units: native SBML value
  description: Boundary species `IPTG`, the source induction level for this sigma-B
    model variant.
io:
  inputs:
  - name: iptg
    maps_to: IPTG
    label: IPTG
    description: Boundary species `IPTG`, the source induction level for this sigma-B
      model variant.
  outputs:
  - name: sigma_b
    maps_to: sigb
    label: sigb
    description: sigb observable. Maps to SBML symbol `sigb`.
  - name: lacz_reporter
    maps_to: lacz
    label: lacz
    description: lacz observable. Maps to SBML symbol `lacz`.
  - name: model_state_x
    maps_to: x
    label: x
    description: x observable. Maps to SBML symbol `x`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
