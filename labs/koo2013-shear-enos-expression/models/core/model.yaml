schema_version: '2.0'
title: Koo2013 - Shear stress induced eNOS expression - Model 3
description: "Andrew Koo, David Nordsletten, Renato Umeton, Beracah Yankama, Shiva\
  \ Ayyadurai, Guillermo Garc\xEDa-Carde\xF1a & C. It can be used to explore generegulation\
  \ koo2013 shear stress induced enos dynamics and compare simulation behavior across\
  \ conditions."
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Andrew Koo
- David Nordsletten
- Renato Umeton
- Beracah Yankama
- Shiva Ayyadurai
upstream:
  id: biomodels_ebi:BIOMD0000000466
  source_db: biomodels_ebi
  source_id: BIOMD0000000466
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000466
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000466?filename=BIOMD0000000466_url.xml
  license: CC0
biosim:
  entrypoint: src.koo2013_shear_stress_induced_enos_expression_mod_biomd0000000466_model:Koo2013ShearStressInducedEnosExpressionModBiomd0000000466Model
  init_kwargs:
    model_path: data/BIOMD0000000466.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: enos
    maps_to: s106
    label: eNOS
    description: eNOS observable. Maps to SBML symbol `s106`.
  - name: klf2
    maps_to: s49
    label: KLF2
    description: KLF2 observable. Maps to SBML symbol `s49`.
  - name: ap1
    maps_to: s42
    label: AP 1
    description: AP 1 observable. Maps to SBML symbol `s42`.
  - name: active_ras
    maps_to: s102
    label: Ras:GTP
    description: Ras:GTP observable. Maps to SBML symbol `s102`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
