    lab_title: Hu2020 Ecoli Translation Lab
    question: Which translation components dominate E. coli translation dynamics?
    answer_focus: translation network state and bottlenecks
    caveat: Large model; headline outputs are a curated subset of the SBML state.
    alias: hu2020_ecoli_translation
