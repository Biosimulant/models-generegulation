    - id: EFTu
      port: elongation_factor_tu
      label: translation elongation factor Tu (EF Tu)
    - id: EFTu_GTP
      port: elongation_factor_tu_gtp
      label: The complex of EF Tu and GTP
    - id: EFTs
      port: elongation_factor_ts
      label: translation elongation factor Ts (EF Ts)
    - id: Ala1B_tRNA
      port: alanine_trna_pool
      label: charged tRNA Ala1B
