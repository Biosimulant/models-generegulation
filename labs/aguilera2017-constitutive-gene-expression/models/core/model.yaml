schema_version: '2.0'
title: Aguilera2017 - Model for gene constitutive expression circuit
description: Model destription:The model describes the stochastic dynamics of two
  variables, protein and mRNA of a gene with constitutive expression. Publication:A
  New Efficient Approach to Fit Stochastic Models o.
standard: sbml
tags:
- generegulation
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Aguilera
- Luis U.
- Christoph Zimmer
- and Ursula Kummer
upstream:
  id: biomodels_ebi:MODEL1608100000
  source_db: biomodels_ebi
  source_id: MODEL1608100000
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1608100000
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1608100000?filename=MODEL1608100000_url.xml
  license: CC0
biosim:
  entrypoint: src.aguilera2017_model_for_gene_constitutive_express_model1608100000_model:Aguilera2017ModelForGeneConstitutiveExpressModel1608100000Model
  init_kwargs:
    model_path: data/MODEL1608100000.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
io:
  inputs: []
  outputs:
  - name: messenger_rna
    maps_to: mRNA
    label: mRNA
    description: mRNA observable. Maps to SBML symbol `mRNA`.
  - name: protein
    maps_to: Protein
    label: Protein
    description: Protein observable. Maps to SBML symbol `Protein`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    description: Change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML observable symbols to display labels.
