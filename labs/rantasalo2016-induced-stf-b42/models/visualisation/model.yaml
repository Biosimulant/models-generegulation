schema_version: '2.0'
title: Rantasalo2016 - Synthetic expresion modulator induced STF_B42 Visualisation
description: Dedicated presentation model for induced synthetic expression modulator.
standard: other
tags:
- generegulation
- visualisation
authors:
- Biosimulant Team
