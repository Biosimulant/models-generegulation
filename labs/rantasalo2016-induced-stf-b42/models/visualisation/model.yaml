    - MetTF
    - Met
    - DTF
    - BTF
    - B
    - Met_MetTF
    - Pol_TFn_B_CP2
    species_label_ids:
    - MmCherryc
    - mCherryc
    - TFc
    - MTFc
    - Pol
    - TFn_B
    - CP
    - Pol_TFn_B
    - TFn
    - Pol_DTF
    - MetTF_BTF
    - MetTF
    - Met
    - DTF
    - BTF
    - B
    - Met_MetTF
